# Cascade tracking (Constitution Art. II.2).
# `derived_from_version` records the upstream version this artifact was last
# reconciled against. When upstream `version` exceeds it, `sdd verify` marks
# this artifact stale and the build fails until it is re-reviewed and re-stamped.
feature: 004-kube-exec
artifacts:
  # The goals document is every feature's root upstream. Without this entry an
  # amendment to the goals could not mark a feature's spec stale, which is the
  # cascade Article II.2 exists to enforce.
  - id: goals
    path: ../../docs/en/project-goals.md
    version: 1.1.5
    upstream: null
    derived_from_version: null
  - id: spec
    path: spec.md
    version: 1.0.0
    upstream: goals
    derived_from_version: 1.1.5
  - id: plan
    path: plan.md
    version: 1.0.0
    upstream: spec
    derived_from_version: 1.0.0
  - id: hld
    path: design-hld.md
    version: 1.0.0
    upstream: plan
    derived_from_version: 1.0.0
  - id: lld
    path: design-lld.md
    version: 1.0.0
    upstream: hld
    derived_from_version: 1.0.0
  - id: tasks
    path: tasks.md
    version: 1.0.1
    upstream: lld
    derived_from_version: 1.0.0
