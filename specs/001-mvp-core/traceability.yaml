# Cascade tracking (Constitution Art. II.2).
# `derived_from_version` records the upstream version this artifact was last reconciled
# against. When the upstream's `version` exceeds it, `sddctl verify` marks this artifact
# stale and CI fails until it is re-reviewed and re-stamped via `.specify/scripts/sdd.sh amend`.
feature: 001-mvp-core
artifacts:
  - id: goals
    path: ../../docs/en/project-goals.md
    version: 1.1.0
    upstream: null
    derived_from_version: null
  - id: spec
    # Re-reviewed against goals 1.1.0: the amendment records what was delivered
    # and moves K8s exec into M2, both of which spec.md §3 already states.
    path: spec.md
    version: 1.0.0
    upstream: goals
    derived_from_version: 1.1.0
  - id: plan
    path: plan.md
    version: 1.0.0
    upstream: spec
    derived_from_version: 1.0.0
  - id: hld
    path: design-hld.md
    version: 1.0.0
    upstream: plan
    derived_from_version: 1.0.0
  - id: lld
    path: design-lld.md
    version: 1.0.1
    upstream: hld
    derived_from_version: 1.0.0
  - id: tasks
    # Re-reviewed against lld 1.0.1: the exec-plugin decision changes no task.
    path: tasks.md
    version: 1.0.0
    upstream: lld
    derived_from_version: 1.0.1
