# Cascade tracking (Constitution Art. II.2).
# `derived_from_version` records the upstream version this artifact was last
# reconciled against. When upstream `version` exceeds it, `sdd verify` marks
# this artifact stale and the build fails until it is re-reviewed and re-stamped.
feature: NNN-slug
artifacts:
  - id: spec
    path: spec.md
    version: 0.1.0
    upstream: null
    derived_from_version: null
  - id: plan
    path: plan.md
    version: 0.1.0
    upstream: spec
    derived_from_version: 0.1.0
  - id: hld
    path: design-hld.md
    version: 0.1.0
    upstream: plan
    derived_from_version: 0.1.0
  - id: lld
    path: design-lld.md
    version: 0.1.0
    upstream: hld
    derived_from_version: 0.1.0
  - id: tasks
    path: tasks.md
    version: 0.1.0
    upstream: lld
    derived_from_version: 0.1.0
