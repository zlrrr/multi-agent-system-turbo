  the authorised API and is placed with textContent — never parsed as markup —

  logs (specs/012-web-console/design-hld.md §4).
-->
<header id="bar">
  <a id="brand" href="#/runs">MAS-Turbo</a>
  <nav id="nav"></nav>
  <div id="bar-right">
    <button id="lang-toggle" type="button">中文</button>
    <button id="signout" type="button" hidden></button>
  </div>
</header>
<main id="view"></main>
<footer id="foot"></footer>
<script src="app.js"></script>
</body>
</html>
