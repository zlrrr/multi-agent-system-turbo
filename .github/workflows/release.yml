name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (dry run; nothing is published)"
        required: true
        default: "v0.0.0-dryrun"

permissions:
  contents: write
  packages: write

env:
  GO_VERSION: "1.24"
  REGISTRY: ghcr.io

jobs:
  binaries:
    name: Binaries and checksums
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      # A release must never ship something that does not pass its own checks.
      - name: Gate on the full suite
        run: |
          go vet ./...
          go test -race ./...
          go run ./cmd/sddctl verify

      # Cross-compile, package and verify — all `make dist`, which `make ci` also
      # runs on every push. Packaging used to be inline shell in this file,
      # where it ran only on a tag: the first attempt to cut v0.1.0 discovered
      # on the tag push that it had never worked.
      - name: Cross-compile, package and verify
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          COMMIT=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          make dist VERSION="$VERSION" COMMIT="$COMMIT" BUILD_DATE="$BUILD_DATE"
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
          retention-days: 30

  image:
    name: Container image
    runs-on: ubuntu-latest
    needs: binaries
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to the registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          load: ${{ github.event_name != 'push' }}
          tags: ${{ steps.meta.outputs.tags || 'mas-turbo:dryrun' }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.binaries.outputs.version }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: [binaries, image]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-binaries
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
          body: |
            ## MAS-Turbo ${{ needs.binaries.outputs.version }}

            A read-only diagnostic multi-agent system for open-source middleware.

            ### Container image
            ```
            docker pull ghcr.io/${{ github.repository }}:${{ needs.binaries.outputs.version }}
            ```

            ### Binaries
            Each archive contains the `mas` binary, the bilingual user manual, the
            configuration reference and an example configuration. Verify against
            `SHA256SUMS` before use.

            ### First run
            ```
            mas doctor                 # validate configuration and probe endpoints
            mas diagnose --target <id> --symptom "what you observed" --since 1h
            ```

            MAS-Turbo performs no action against the systems it inspects. Every
            recommendation is for a human operator to carry out.
